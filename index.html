<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findtrend</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <!--Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
</head>
<body>

    <div class="navigation">

        <div class="navigation__logo">
            <a class="navigation__logo--img" href="./index.html">
                <img src="./assets/image/logo.svg" alt="Logo">
            </a>
            <span class="navigation__logo--text">Findtrend</span>
        </div>

        <nav class="navigation__nav">

            <ul class="navigation__list">
                <li class="navigation__item"><a href="#" class="navigation__link">About</a></li>
                <li class="navigation__item"><a href="#" class="navigation__link">How it work</a></li>
                <li class="navigation__item"><a href="#" class="navigation__link">Pricing</a></li>
                <li class="navigation__item"><a href="#" class="navigation__link">Solution</a></li>
                <li class="navigation__item"><a href="#" class="navigation__link">Features</a></li>
            </ul>

            <div class="navigation__login">
                <button class="login-btn btn-black">Login</button>
                <button class="login-btn btn-white">Register</button>
            </div>

        </nav>

        <div class="btn-toggle">
            <span class="first-line-span"></span>
            <span class="last-line-span"></span>
        </div>

        <h1 class="header__title"">
            Minimize your tabs. <br>
            Find the trends!

        <div class="header__btn">
            <button class="get-start">Get Started 🔥</button>
            <img src="./assets/image/hero-comment.svg" alt="">

        <div class="header__social">
            <img src="./assets/image/twitter-rotate-4.svg" alt="">
            <img src="./assets/image/pinterest-rotate.svg" alt="">
            <img src="./assets/image/facebook-rotate.svg" alt="">
